/* ---- escritorio: el mapa ocupa toda la ventana; todo lo demás flota encima ---- */
body.dsk{--bg:#12141a;--fg:#e8e6df;--panel:#1c1f28;--line:#343948;--btn:#262a36;--acc:#e8b04a;color-scheme:dark;overflow:hidden;background:var(--panel2)}
body.dsk #sh{color:var(--red)}body.dsk #sg{color:var(--gold)}
body.dsk #game{position:fixed;inset:0;padding:0;display:block}
body.dsk main{max-width:none;height:100%}
body.dsk h1{display:none}
body.dsk #cw{position:fixed;inset:0;max-width:none;margin:0}
body.dsk canvas#c{width:100%;height:100%;border:0;border-radius:0}
body.dsk .fl{background:color-mix(in srgb,var(--panel) 84%,transparent);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
body.dsk #stats{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:12;gap:26px;padding:7px 20px;border-radius:22px;white-space:nowrap;background:color-mix(in srgb,var(--panel) 84%,transparent);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
body.dsk #relics{position:fixed;left:8px;bottom:8px;z-index:12;margin:0;max-width:24vw;min-height:0;padding:6px 8px;border-radius:12px;background:color-mix(in srgb,var(--panel) 84%,transparent);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
body.dsk #relics:empty{display:none}
body.dsk #panel{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:12;width:max-content;min-width:min(420px,calc(100vw - 40px));max-width:min(820px,calc(100vw - 2*min(24vw,300px) - 60px));max-height:44vh;overflow:auto;min-height:0;box-sizing:border-box;border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.35)}
body.dsk #ctl,body.dsk #opt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(44vh + 18px);z-index:12;margin:0}
body.dsk #ctl:empty,body.dsk #opt:empty{display:none}
body.dsk #mbl{top:8px;right:8px;bottom:auto;left:auto}
body.dsk #zm{top:52px}
body.dsk #ver{position:fixed;top:46px;left:50%;transform:translateX(-50%);margin:0;z-index:11;font-size:10px;opacity:.55}
body.dsk.inmenu #stats,body.dsk.inmenu #relics,body.dsk.inmenu #panel,body.dsk.inmenu #ver,body.dsk.ovl #stats,body.dsk.ovl #relics,body.dsk.ovl #panel,body.dsk.ovl #ver,body.dsk.ovl #ctl,body.dsk.ovl #opt{display:none}
#fps{position:absolute;top:8px;right:48px;z-index:3;font:700 12px/1 system-ui,sans-serif;padding:4px 7px;border-radius:6px;background:color-mix(in srgb,var(--panel) 75%,transparent);pointer-events:none;display:none}
body.dsk #fps{position:fixed;top:44px;right:8px}body.dsk.fpsx #zm{top:74px}body.inmenu #fps{display:none!important}
#stR,#stC{color:var(--fg1)}
/* miniatura del menú de Opciones (para enseñar la personalización) */
.omk{display:inline-block;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;margin:6px auto;font-size:12px;min-width:250px;max-width:320px}
.omk .ot{display:flex;gap:5px;margin-bottom:6px}.omk .ot span{padding:2px 7px;border-radius:5px;border:1px solid var(--line2);font-size:11px;opacity:.7}.omk .ot span.on{border-color:var(--acc);opacity:1}
.omk .orw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-top:1px solid #2c303c}.omk .orw.hl{color:var(--hl)}
.omk .tg{width:26px;height:14px;border-radius:8px;background:#3a3f4f;position:relative;flex:0 0 26px}.omk .tg::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--fg1)}.omk .tg.on{background:var(--acc)}.omk .tg.on::after{left:14px;background:var(--panel2)}
/* siluetas de recompensas por conseguir */
.sil{display:inline-block;font-size:22px;line-height:1;filter:brightness(0) invert(.38) drop-shadow(0 0 1px rgba(255,255,255,.7));font-size:26px;cursor:help}

#apan{display:none;position:absolute;top:8px;left:52px;z-index:14;width:min(300px,70vw);max-height:70vh;overflow:auto;padding:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.4);color:var(--fg);font-size:13px}
#apan.on{display:block}body.inmenu #apan{display:none!important}#apan .apr{padding:6px 0;border-top:1px solid #2c303c}#apan .apr:first-of-type{border-top:0}#apan button{margin:8px 0 0;width:100%}
.apb{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 2px}.apb span{display:block;height:100%;background:var(--acc);border-radius:3px}.apb.cur span{background:#6fe07a}
.ast{font-size:12px;margin-top:3px}.ast.ok{color:#6fe07a}.ast.ko{color:var(--red)}.ast.nt{color:var(--fg2)}
button.pinb{float:right;margin:-2px 0 0 6px;padding:0 6px;font-size:13px;line-height:22px;opacity:.55}button.pinb.on{opacity:1;border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
[data-a="comp"].lk{opacity:.55;position:relative}[data-a="comp"].lk::after{content:'🔒';position:absolute;right:-4px;bottom:-4px;font-size:11px}
/* ventanas de partida sobre el mapa desenfocado */
#relic.open.blur{background:rgba(13,14,18,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:safe center;animation:blin .25s ease-out}
@keyframes blin{from{opacity:0}to{opacity:1}}
#relic.blur>*{max-width:min(1100px,100%)}
.toff{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tof{background:color-mix(in srgb,var(--panel) 95%,transparent);border:1px solid var(--line2);border-radius:12px;padding:14px;width:220px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tof .tic{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px}
.tof .tnm{font-size:17px;font-weight:700}.tof .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.tof .chips span{font-size:11px;padding:2px 7px;border-radius:9px;border:1px solid var(--line2);background:var(--panel)}
.tof details{width:100%;text-align:left}.tof summary{cursor:pointer;font-size:12px;color:var(--fg1);text-align:center;list-style:none}.tof summary::-webkit-details-marker{display:none}.tof details[open] summary{margin-bottom:6px}
.tof button{width:100%;margin:0}

/* ---- selección de héroe (propuesta C) ---- */
.hpc{position:relative;height:calc(100% + 24px);min-height:420px;margin:-12px;padding:0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;
 background:radial-gradient(ellipse at 72% 40%,color-mix(in srgb,var(--hc) 45%,transparent),transparent 62%),linear-gradient(160deg,#171a22,#0f1116)}
.hpc .hart{position:absolute;right:2%;top:2%;bottom:96px;width:52%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hpc .hart svg{height:100%;max-width:100%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.hpc .hart.lk svg{filter:brightness(0) opacity(.55)}
.hpc .hinfo{position:relative;z-index:1;margin:5vh 0 0 5%;width:min(470px,44%);background:rgba(15,17,22,.72);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px 20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hpc .hnm{font:700 40px/1.05 Georgia,"Times New Roman",serif;color:#f2d27a;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hpc .hnm small{font:400 12px system-ui,sans-serif;color:var(--fg2)}
.hpc .hcl{color:var(--fg1);margin:4px 0 8px}
.hpc .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.hpc .chips span{font-size:11.5px;padding:2px 8px;border-radius:9px;border:1px solid var(--line2);background:var(--panel)}
.hpc .hds{color:#d8d6cf;font-size:13.5px;line-height:1.45;margin:0 0 12px}
.hpc .hbar{font-size:12px;margin:5px 0}.hpc .hbar>span:first-child{width:62px}
.hpc .hsec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin:14px 0 6px}
.hpc .hrl{display:flex;gap:10px;align-items:flex-start}.hpc .hrl .ri{width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:21px}
.hpc .hrl b{font-size:14px}.hpc .hrl small{display:block;color:var(--fg1);font-size:12px;line-height:1.35}
.hpc .hdk2{display:flex;gap:8px}.hpc .hdk2 span{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 9px 4px 4px}.hpc .hdk2 i{font-style:normal;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
.hpc .habs{display:flex;gap:8px}.hpc .habs span{position:relative;width:42px;height:42px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:21px;cursor:help}.hpc .habs em{position:absolute;bottom:-6px;right:-6px;font:700 10px system-ui;font-style:normal;background:var(--acc);color:var(--panel2);border-radius:7px;padding:1px 5px}
.hpc details{margin-top:12px}.hpc summary{cursor:pointer;color:var(--fg1);font-size:12.5px;list-style:none}.hpc summary::-webkit-details-marker{display:none}.hpc details .hst{margin-top:8px}
.hpc .hbot{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(transparent,rgba(10,11,15,.9) 45%);z-index:2}
.hpc .hbot .rost{display:flex;gap:10px}
.hpc .rt{width:58px;height:58px;border-radius:12px;padding:0;margin:0;overflow:hidden;border:2px solid var(--line);background:var(--panel);position:relative}.hpc .rt svg{width:100%;height:100%}
.hpc .rt.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(232,176,74,.35);transform:translateY(-4px)}.hpc .rt.lk svg{filter:brightness(0) opacity(.6)}.hpc .rt .lc{position:absolute;right:2px;bottom:1px;font-size:13px}
.hpc .hinfo{max-height:calc(100% - 130px);overflow:auto;box-sizing:border-box}
@media (max-height:600px),(max-width:860px){.hpc .hinfo{margin:12px 0 0 12px;width:min(470px,56%);padding:12px 14px}.hpc .hnm{font-size:28px}.hpc .hbot{height:78px}.hpc .rt{width:46px;height:46px}.hpc .hart{bottom:78px}}
@media (max-width:560px){.hpc .hinfo{width:auto;margin:10px}.hpc .hart{opacity:.25;width:100%;right:0}}
.hpc .hbk{position:absolute;left:18px;bottom:24px;margin:0}.hpc .hok2{position:absolute;right:18px;bottom:20px;margin:0;padding:12px 22px;font-size:16px;font-weight:700;background:var(--acc);color:var(--accfg);border-color:var(--acc)}.hpc .hok2[disabled]{opacity:.5}
.arw{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:6px 0 10px;font-size:13px}.rwi{position:relative;display:inline-flex;cursor:help}.rwi .sil,.rwi .rwc{font-size:28px;line-height:1}.rwi .alk{position:absolute;right:-7px;bottom:-5px;font-size:12px;filter:drop-shadow(0 0 2px #000)}.alk.anim{width:1.2em;height:1.2em}.alk.anim i{font-style:normal;position:absolute;right:0;bottom:0}.alk.anim .c{animation:alkc 1.1s .35s forwards}.alk.anim .o{opacity:0;animation:alko 1.1s .35s forwards}@keyframes alkc{0%{transform:none}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}55%{transform:scale(1.25);opacity:1}70%,100%{transform:scale(1.4);opacity:0}}@keyframes alko{0%,55%{opacity:0;transform:scale(.6)}75%{opacity:1;transform:scale(1.45)}100%{opacity:1;transform:none}}.rwi:has(.alk.anim) .rwc{animation:alkr 1.1s .35s both}@keyframes alkr{0%,55%{filter:brightness(0) opacity(.5)}100%{filter:none}}@media (prefers-reduced-motion:reduce){.alk.anim .c{animation:none;opacity:0}.alk.anim .o{animation:none;opacity:1}.rwi:has(.alk.anim) .rwc{animation:none}}.aic{display:inline-block}.aic.off{filter:grayscale(1) opacity(.45)}

/* ---- diálogos de la historia ---- */
#dlg{position:fixed;inset:0;z-index:98;display:none;background:rgba(8,9,13,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer;user-select:none;-webkit-user-select:none}
#dlg.on{display:block;animation:blin .3s ease-out}
#dlg .dbx{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);width:min(760px,92vw);box-sizing:border-box;background:rgba(14,18,26,.95);border:1px solid #3fa7c9;border-radius:14px;padding:16px 20px 22px;box-shadow:0 0 0 1px rgba(63,167,201,.15),0 10px 40px rgba(0,0,0,.5);color:#dfeef5}
#dlg .dsp{font:700 13px/1 system-ui,sans-serif;letter-spacing:.14em;color:#6fd3f0;margin-bottom:8px}
#dlg .dtx{font-size:17px;line-height:1.55;min-height:3.1em;white-space:pre-wrap}
#dlg.big .dtx{font-size:21px}
#dlg .dnx{position:absolute;right:16px;bottom:8px;font-size:12px;opacity:0}#dlg .dnx.on{opacity:.7;animation:ipr 1.4s infinite}
#dlg .dbx.nar{background:transparent;border:0;box-shadow:none;bottom:40vh;text-align:center}#dlg .dbx.nar .dtx{font:italic 400 24px/1.5 Georgia,"Times New Roman",serif;color:var(--fg)}#dlg.big .dbx.nar .dtx{font-size:28px}
#dlg .dbx.gl .dtx{animation:dgl 3.2s infinite steps(1)}#dlg .dbx.g3 .dtx{animation:dgl3 1.7s infinite steps(1)}#dlg .dbx.g2 .dtx{animation:dgl 2.2s infinite steps(1)}#dlg .dbx.g1 .dtx{animation:dgl 3.4s infinite steps(1)}#dlg .dbx.gk{animation:dshk .18s linear 2}#dlg .dtx .gch{color:#6fd3f0;text-shadow:2px 0 #ff4fa0,-2px 0 #3df2ff}
@keyframes dgl3{0%,80%,100%{opacity:1;transform:none;text-shadow:none}82%{opacity:.4;transform:translateX(3px) skewX(-6deg);text-shadow:2px 0 #ff4fa0,-2px 0 #3df2ff}85%{opacity:.85;transform:translateX(-3px);text-shadow:-2px 0 #ff4fa0,2px 0 #3df2ff}88%{opacity:1;transform:translateY(1px)}91%{opacity:.5;transform:translateX(2px)}}@keyframes dshk{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% + 4px))}75%{transform:translateX(calc(-50% - 4px))}}@keyframes dgl{0%,93%,100%{opacity:1;transform:none}94%{opacity:.35;transform:translateX(2px)}96%{opacity:.8;transform:translateX(-2px)}}
#dlg .din{display:flex;gap:8px;margin-top:10px}#dlg .din input{flex:1;font:inherit;font-size:16px;padding:8px 10px;border-radius:7px;border:1px solid #3fa7c9;background:#0c1018;color:#dfeef5}#dlg .din button{margin:0}
#dlg .dsk{position:absolute;top:14px;right:16px;margin:0;font-size:12px;padding:5px 10px;opacity:.7}
/* ---- pantalla de era ---- */
.era{max-width:620px;width:100%;text-align:center}.era h3{margin-bottom:2px}
.era .eline{display:flex;justify-content:center;gap:8px;margin:14px 0 18px;flex-wrap:wrap}.era .eline span{padding:4px 10px;border-radius:9px;border:1px solid var(--line);font-size:12px;opacity:.55}.era .eline span.on{border-color:var(--acc);opacity:1;color:#f2d27a}
.era .pcs{display:flex;justify-content:center;gap:14px;margin:12px 0}.era .pc{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;font-size:26px}.era .pc.got{border:2px solid #6fd3f0;background:radial-gradient(circle,rgba(111,211,240,.35),transparent 70%);box-shadow:0 0 18px rgba(111,211,240,.35)}
.era .eter{background:rgba(14,18,26,.9);border:1px solid #3fa7c9;border-radius:12px;padding:10px 14px;text-align:left;margin:8px auto 16px;color:#dfeef5;font-size:14px}.era .eter b{color:#6fd3f0;font-size:12px;letter-spacing:.12em;display:block;margin-bottom:4px}

.orow.otg{display:flex;align-items:center;gap:16px;justify-content:space-between;max-width:720px}.orow.otg .otl{flex:1;min-width:0}
.sw{flex:0 0 auto;position:relative;width:46px;height:26px;padding:0;margin:0;border-radius:13px;border:1px solid var(--line2);background:var(--btn);cursor:pointer;transition:background .18s,border-color .18s}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--fg1);box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .18s,background .18s}
.sw.on{background:var(--acc);border-color:var(--acc)}.sw.on i{transform:translateX(20px);background:#fff}
.sw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw,.sw i{transition:none}}

 blizz:{n:'Ventisca',ranks:[{c:55,cd:25,d:5},{c:60,cd:20,d:6}],txt:r=>`Cada <span class="cr">${r.cd} s</span>, si hay enemigos en el aura, los ${kw('freeze','congela','')} a todos durante <span class="cr">${r.d} s</span>. Los jefes, la mitad.`},
 overl:{n:'Sobrecarga',ranks:[{c:50,g:.1,max:1},{c:55,g:.15,max:1}],txt:r=>`Mientras el rayo siga sobre el mismo enemigo, su daño sube un <span class="cd">${Math.round(r.g*100)}%</span> por segundo, hasta un máximo de +${Math.round(r.max*100)}%. Se reinicia al cambiar de objetivo.`},
 arcpen:{n:'Penetración arcana',ranks:[{c:35,pen:15},{c:40,pen:20},{c:45,pen:25}],txt:r=>`El rayo gana <span class="cmg">${r.pen}</span> de ${kw('penp','penetración mágica','')}.`},
 split:{n:'Divisor',ranks:[{c:45,n:2},{c:50,n:3},{c:55,n:4}],txt:r=>`El rayo se divide en <b>${r.n}</b> rayos, cada uno sobre un enemigo distinto. Los rayos reparten los elementos en orden (${ELEMS.map(e=>`<span style="color:${e.col}">${e.n}</span>`).join(', ')}) y cada rayo aplica 1 stack de su elemento cada 1,5 s.`},
 trail:{n:'Estela',ranks:[{c:35,p:.2},{c:45,p:.35}],txt:r=>`Los enemigos que cruza cada rayo de camino a su objetivo reciben el <span class="cd">${Math.round(r.p*100)}%</span> de su daño, sin stacks elementales.`},
 plague:{n:'Plaga',ranks:[{c:45,p:.5},{c:50,p:1}],txt:r=>`Cuando muere un enemigo envenenado por esta torre, el <span class="cc">${Math.round(r.p*100)}%</span> de sus stacks pasa a los enemigos cercanos (2 casillas).`},
 corr:{n:'Corrosión',ranks:[{c:35,a:2,max:10},{c:40,a:3,max:15},{c:45,a:4,max:20}],txt:r=>`Cada segundo, por cada 5 stacks de veneno de esta torre que tenga el enemigo, recibe un golpe de ${kw('brk','Armadura rota','')}: <span class="cph">−${r.a}</span> de armadura, acumulable hasta <span class="cph">−${r.max}</span>.`},
 ponz:{n:'Ponzoña',ranks:[{c:40,m:2},{c:50,m:3}],txt:r=>`Cada vez que esta torre aplica ${kw('poison','Veneno','')}, pone <span class="cpo">${r.m} veces</span> los stacks.`},
 toxin:{n:'Toxina letal',ranks:[{c:35,cr:.1,el:.1},{c:40,cr:.15,el:.15},{c:45,cr:.2,el:.2}],txt:r=>`+<span class="cc">${Math.round(r.cr*100)}%</span> de probabilidad de crítico, y el veneno de esta torre hace un +${Math.round(r.el*100)}% de daño a mini-élites, élites y jefes.`},
 heal:{n:'Manos curativas',ranks:[{c:35,cd:10,p:.2},{c:40,cd:10,p:.3},{c:45,cd:10,p:.4}],txt:r=>`Cada <span class="cr">${r.cd} s</span>, cura a todos sus soldados un <span class="chp">${Math.round(r.p*100)}%</span> de su vida máxima.`},
 wall:{n:'Muro de escudos',ranks:[{c:40,red:.1},{c:50,red:.15},{c:60,red:.2}],txt:r=>`Los soldados reciben un <span class="chp">${Math.round(r.red*100)}%</span> menos de daño y cada uno tiene <b>corpulencia 2</b>: detiene solo a un enemigo grande, o a dos enemigos normales a la vez.`},
 dodge:{n:'Esquiva',ranks:[{c:35,p:.2},{c:40,p:.3},{c:45,p:.4}],txt:r=>`Cada golpe que reciben los soldados tiene un <span class="cc">${Math.round(r.p*100)}%</span> de ser esquivado.`},
 cut:{n:'Filo sangrante',ranks:[{c:30,p:.1},{c:35,p:.15},{c:40,p:.2}],txt:r=>`Cada golpe tiene un <span class="cc">${Math.round(r.p*100)}%</span> de aplicar 1 stack de ${kw('bleed','Sangrado','')}. Además, cada golpe a un enemigo con Sangrado le hace al instante el daño de todos sus stacks, aunque esté quieto.`},
 burst:{n:'Ráfaga',ranks:[{c:35,n:6,a:2},{c:45,n:5,a:3}],txt:r=>`Uno de cada <b>${r.n}</b> disparos lanza <b>${r.a} flechas</b> a la vez al mismo objetivo.`},
 mark:{n:'Marca de cazador',ranks:[{c:40,cr:.1},{c:50,cr:.2}],txt:r=>`Cada impacto deja al enemigo ${kw('mark','Marcado','')} durante <span class="cr">4 s</span>: todas tus torres y unidades tienen un <span class="cc">+${Math.round(r.cr*100)}%</span> de probabilidad de ${kw('crit','crítico','')} contra él.`},
 cluster:{n:'Racimo',ranks:[{c:40,n:2},{c:45,n:3},{c:50,n:4}],txt:r=>`Al explotar, cada bomba suelta <b>${r.n}</b> bombas pequeñas a su alrededor (1 casilla), cada una con el <span class="cd">25%</span> del daño y un ${kw('area','área','')} de 0,5 casillas.`},
 hollow:{n:'Carga hueca',ranks:[{c:40,p:.01},{c:50,p:.015}],txt:r=>`El daño físico de esta torre (bombas, área y minas) aumenta un <span class="cd">+${f(r.p*100)}%</span> por cada punto de ${kw('aphys','armadura','')} del objetivo. Contra un enemigo sin armadura no cambia nada.`},
 shatter:{n:'Fragilidad',ranks:[{c:40,m:1.5},{c:45,m:2},{c:50,m:3}],txt:r=>`Cuando un enemigo ${kw('freeze','congelado','')} por esta torre se descongela, estalla en escarcha: hace daño ${kw('tmagic','mágico','')} de <span class="cd">×${f(r.m)}</span> el daño de un disparo a todos los enemigos a 1 casilla o menos.`},
 bite:{n:'Escarcha intensa',ranks:[{c:45,g:.1,max:.5,pct:1},{c:55,g:.2,max:1,pct:1}],txt:r=>`El daño del aura a cada enemigo sube un <span class="cd">+${Math.round(r.g*100)}%</span> por cada segundo que lleva dentro, hasta un <span class="cd">+${Math.round(r.max*100)}%</span>. Vuelve a cero si sale del aura.`},
 conv:{n:'Convergencia',ranks:[{c:40,p:.25},{c:50,p:.5}],txt:r=>`Al matar a su objetivo, el rayo conserva el <span class="cd">${Math.round(r.p*100)}%</span> de la Sobrecarga acumulada para el siguiente enemigo, en vez de empezar de cero.`},
 refr:{n:'Refracción',ranks:[{c:40,p:.1},{c:50,p:.2}],txt:r=>`Cada rayo elemental tiene un <span class="cc">${Math.round(r.p*100)}%</span> de rebotar a otro enemigo a 2 casillas o menos, con el mismo daño y el mismo stack.`},
 flask:{n:'Matraz volátil',ranks:[{c:45,cd:20},{c:55,cd:15}],txt:r=>`Cada <span class="cr">${r.cd} s</span>, lanza un matraz a la zona de su rango con más enemigos y crea allí un charco extra de ${kw('poison','veneno','')} durante <span class="cr">4 s</span>.`},
 epid:{n:'Epidemia',ranks:[{c:40,p:.25},{c:45,p:.35},{c:50,p:.5}],txt:r=>`Cuando muere un enemigo envenenado por esta torre, explota y hace a los enemigos a 1,5 casillas o menos daño ${kw('telem','elemental','')} igual al <span class="cd">${Math.round(r.p*100)}%</span> del veneno que le quedaba.`},
 sacred:{n:'Aura sagrada',ranks:[{c:35,a:5},{c:45,a:10}],txt:r=>`Las unidades aliadas (soldados y héroe) a 2 casillas o menos de la bandera ganan <span class="cph">+${r.a}</span> de ${kw('aphys','armadura','')} y <span class="cmg">+${r.a}</span> de ${kw('umr','resistencia mágica','')}.`},
 back:{n:'Golpe por la espalda',ranks:[{c:40,m:2},{c:45,m:2.5},{c:50,m:3}],txt:r=>`El primer golpe de cada soldado a un enemigo nuevo hace <span class="cd">×${f(r.m)}</span> de daño.`},
 cond:{n:'Conductor',ranks:[{c:35,n:1},{c:40,n:3},{c:45,n:5}],txt:r=>`El rayo rebota <b>${r.n}</b> ${r.n===1?'vez':'veces'} más (${kw('chain','Rebote','')}). Si no quedan enemigos nuevos a su alcance, rebota de vuelta a los que ya tocó.`},
 disch:{n:'Descarga',ranks:[{c:35,p:.1},{c:40,p:.15},{c:45,p:.2}],txt:r=>`Cada impacto tiene un <span class="cc">${Math.round(r.p*100)}%</span> de ${kw('stun','aturdir','')} al enemigo <span class="cr">${f(STUNT)} s</span>. Los jefes, la mitad.`},
 storm:{n:'Pararrayos',ranks:[{c:50,cd:8,m:5},{c:55,cd:6,m:5}],txt:r=>`Cada <span class="cr">${r.cd} s</span>, si hay un objetivo, cae un rayo sobre el enemigo con más vida dentro del rango. Hace <span class="cd">${r.m}×</span> el daño del disparo y también rebota.`},
 accum:{n:'Acumulador',ranks:[{c:35,n:2},{c:40,n:3},{c:45,n:4}],txt:r=>`Cada impacto aplica <b>${r.n}</b> stacks de ${kw('ez','Electrizado','')} en vez de 1.`},
 short:{n:'Cortocircuito',ranks:[{c:45,m:3},{c:50,m:4}],txt:r=>`Cuando un enemigo llega a ${EZMAX} stacks de ${kw('ez','Electrizado','')}, recibe un golpe extra de <span class="cd">${r.m}×</span> el daño del disparo y pierde todos sus stacks.`},
 reson:{n:'Resonancia',ranks:[{c:30,t:6},{c:35,t:8},{c:40,t:10}],txt:r=>`Los stacks de ${kw('ez','Electrizado','')} duran <span class="cr">${r.t} s</span> en vez de 4 s.`},
 drench:{n:'Lluvia',ranks:[{c:40,m:.2},{c:50,m:.35}],txt:r=>`La nube llueve: los enemigos bajo ella quedan ${kw('wet','Mojados','')} (${WETT} s). Reciben un <span class="cd">+${Math.round(r.m*100)}%</span> de daño eléctrico, quedan congelados más tiempo y se les apaga la ${kw('burn','Quemadura','')}.`},
 cumulo:{n:'Cumulonimbo',ranks:[{c:45,r:.4}],txt:r=>`La nube es un <span class="ca">${Math.round(r.r*100)}%</span> más grande.`},
 hail:{n:'Granizo',ranks:[{c:40,p:.3},{c:50,p:.5}],txt:r=>`Cada segundo cae granizo sobre todos los enemigos bajo la nube: <span class="cph">${Math.round(r.p*100)}%</span> del daño de la torre como daño físico.`},
 wrath:{n:'Ira divina',ranks:[{c:50,p:.08},{c:60,p:.12}],txt:r=>`El rayo del juicio hace además un <span class="cd">${Math.round(r.p*100)}%</span> de la vida actual de su objetivo (los jefes, la mitad).`},
 fork:{n:'Rayo bifurcado',ranks:[{c:45,n:2},{c:55,n:3}],txt:r=>`El rayo del juicio se divide y cae también sobre los <b>${r.n}</b> enemigos más cercanos a su objetivo (2,5 casillas), con la mitad de daño.`},
 fulg:{n:'Fulgurita',ranks:[{c:40,t:4},{c:50,t:6}],txt:r=>`Donde cae el rayo del juicio, el suelo se vuelve cristal durante <span class="cr">${r.t} s</span>: cada segundo, los enemigos que lo pisan reciben daño eléctrico y 1 stack de ${kw('ez','Electrizado','')}.`},
 hex:{n:'Maleficio',ranks:[{c:45,m:.15},{c:55,m:.25}],txt:r=>`El rayo deja ${kw('cursed','Maldito','')} a su objetivo: recibe un <span class="cmg">+${Math.round(r.m*100)}%</span> de daño mágico de todas las fuentes mientras el rayo lo toca y ${HEXT} s después.`},
 nova:{n:'Nova Arcana',ranks:[{c:45,ch:6,m:3,r:1.5},{c:55,ch:5,m:4,r:2}],txt:r=>`Cada <span class="cr">${r.ch} s</span> de rayo sobre enemigos, el orbe se llena y libera una nova sobre su objetivo: <span class="cmg">${r.m}×</span> el daño por segundo del rayo como daño mágico a todos en <span class="ca">${f(r.r)} casillas</span>.`},
 poly:{n:'Polimorfia',ranks:[{c:50,p:.08,d:3},{c:60,p:.12,d:4}],txt:r=>`Cada segundo de rayo tiene un <span class="cc">${Math.round(r.p*100)}%</span> de dejar ${kw('poly','Transformado','')} (en rana) a su objetivo durante <span class="cr">${r.d} s</span>. Las élites, la mitad; los jefes son inmunes.`},
 raise:{n:'Alzar a los caídos',ranks:[{c:45,d:5,n:3},{c:55,d:7,n:5}],txt:r=>`Los enemigos que mata el rayo (salvo jefes) se alzan como ${kw('spect','espectros','')} durante <span class="cr">${r.d} s</span>, hasta <b>${r.n}</b> a la vez. Caminan hacia los portales y bloquean y golpean a los enemigos que encuentran.`},
 knight:{n:'Caballero Espectral',ranks:[{c:150,n:10,d:12}],txt:r=>`Cada <b>${r.n}</b> espectros alzados aparece un <b>Caballero Espectral</b> durante <span class="cr">${r.d} s</span>: mucho más resistente, bloquea por completo a todo lo que no sea jefe (a los jefes, en parte) y golpea en área. Al desvanecerse lanza un grito de ultratumba: los enemigos a 2 casillas quedan ${kw('fear','Aterrados','')} ${f(FEART)} s.`},
 harvest:{n:'Cosecha de almas',ranks:[{c:40,max:.3},{c:50,max:.5}],txt:r=>`Cada enemigo que muere por el rayo o por sus espectros entrega su alma: <span class="cd">+1%</span> de daño del rayo y de los espectros durante el resto de la partida, hasta <span class="cd">+${Math.round(r.max*100)}%</span>.`},
 erupt:{n:'Erupción',ranks:[{c:45,b:8,r:1.5,cd:6},{c:55,b:12,r:2,cd:5}],txt:r=>`Mientras el Calor está lleno, cada <span class="cr">${r.cd} s</span> estalla un anillo de fuego alrededor de la torre: aplica <span class="cbu">${r.b} stacks</span> de ${kw('burn','Quemadura','')} a todos los enemigos a <span class="ca">${f(r.r)} casillas</span> o menos. No gasta Calor.`},
 flare:{n:'Llamarada',ranks:[{c:35,g:.5},{c:45,g:1}],txt:r=>`Con el Calor alto, el cono también llega más lejos: hasta <span class="cg">+${f(r.g)} ${r.g===1?'casilla':'casillas'}</span> de alcance con el Calor lleno.`},
 embr:{n:'Brasas internas',ranks:[{c:40,k:.5}],txt:r=>`La salamandra se enfría <span class="cr">el doble de despacio</span> cuando no tiene objetivo, así que conserva el Calor entre grupos de enemigos.`},
 melt:{n:'Fundir',ranks:[{c:40,th:20,a:2,max:10},{c:50,th:15,a:3,max:15}],txt:r=>`Mientras su objetivo tenga <b>${r.th}</b> stacks de ${kw('burn','Quemadura','')} o más, cada segundo le aplica ${kw('brk','Armadura rota','')}: <span class="cph">−${r.a}</span> de armadura, acumulable hasta <span class="cph">−${r.max}</span>.`},
 blue:{n:'Llama azul',ranks:[{c:45,th:30,p:.25},{c:55,th:25,p:.4}],txt:r=>`Cuando su objetivo supera <b>${r.th}</b> stacks de ${kw('burn','Quemadura','')}, la llama se vuelve azul y además le hace cada segundo un <span class="cmg">${Math.round(r.p*100)}%</span> del daño de su Quemadura como daño mágico.`},
 sbite:{n:'Mordisco',ranks:[{c:40,cd:5,m:20},{c:50,cd:4,m:30}],txt:r=>`Cada <span class="cr">${r.cd} s</span>, la salamandra muerde al enemigo que está quemando: un golpe de daño físico igual a <span class="cph">${r.m}×</span> sus stacks por tick.`},
 napalm:{n:'Napalm',ranks:[{c:40,t:4},{c:45,t:5},{c:50,t:6}],txt:r=>`Los enemigos golpeados dejan en el camino un charco de fuego que dura <span class="cr">${r.t} s</span> y aplica 1 stack de ${kw('burn','Quemadura','')} por segundo a quien lo pise.`},
 embers:{n:'Rescoldos',ranks:[{c:40,p:.25},{c:45,p:.35},{c:50,p:.5}],txt:r=>`Cuando muere un enemigo quemado por esta torre, el <span class="cc">${Math.round(r.p*100)}%</span> de sus stacks de ${kw('burn','Quemadura','')} pasa a los 2 enemigos más cercanos (2 casillas).`},
 fuel:{n:'Combustible',ranks:[{c:35,d:.3},{c:40,d:.25},{c:45,d:.2}],txt:r=>`Los stacks de ${kw('burn','Quemadura','')} de esta torre se reducen un <b>${Math.round(r.d*100)}%</b> por segundo en vez de un ${Math.round(BURNK*100)}%.`},
 focus:{n:'Foco',ranks:[{c:45,g:.05,max:.25},{c:50,g:.1,max:.35},{c:55,g:.15,max:.5}],txt:r=>`Mientras la llama siga sobre el mismo enemigo, sus stacks de ${kw('burn','Quemadura','')} por tick suben un <span class="cbu">${Math.round(r.g*100)}%</span> por segundo, hasta un máximo de +${Math.round(r.max*100)}%. Se reinicia al cambiar de objetivo.`},
 deton:{n:'Detonación',ranks:[{c:45,th:50,r:1},{c:50,th:40,r:1.2},{c:55,th:30,r:1.5}],txt:r=>`Cuando un enemigo supera <b>${r.th}</b> stacks de ${kw('burn','Quemadura','')}, explota: hace a todos en <span class="ca">${f(r.r)} casillas</span> la mitad del daño de 1 segundo de sus stacks (<span class="cd">${BURND}</span> por stack) y pierde la mitad de ellos.`},
 intens:{n:'Intensidad',ranks:[{c:35,p:.1},{c:40,p:.15},{c:45,p:.2}],txt:r=>`+<span class="cbu">${Math.round(r.p*100)}%</span> de stacks de ${kw('burn','Quemadura','')} por tick.`}};

(function dlgTick(t0){let last=performance.now();const step=t=>{const dt=Math.min(.1,(t-last)/1000);last=t;
 if(DLG.on&&DLG.full!==undefined){const cps={l:22,n:45,r:95}[OPT.dspd||'n'];if(DLG.n<DLG.full.length){DLG.n=Math.min(DLG.full.length,DLG.n+cps*dt);dlgRender();}
  else if(OPT.dauto&&!DLG.lines[DLG.i].input){DLG.wait+=dt;if(DLG.wait>=(OPT.dwait||2)+DLG.full.length/60)dlgNext();}}
 requestAnimationFrame(step);};requestAnimationFrame(step);})();

const INTRO={i:-1,t:0,on:true,fs:false};
function introGo(i){const el=$('intro');INTRO.i=i;INTRO.t=0;for(const s of el.querySelectorAll('.ist'))s.classList.toggle('on',+s.dataset.i===i);
 el.classList.toggle('dark',i<2);el.classList.toggle('ttl',i===2);el.querySelector('.iskip').style.display=i<2?'':'none';}
function introEnd(){INTRO.on=false;const el=$('intro');el.classList.remove('ttl');el.classList.add('out');setTimeout(()=>el.remove(),650);}
function introTap(){if(!INTRO.on)return;if(TOUCH&&FSOK&&OPT.fs&&!INTRO.fs){INTRO.fs=true;enterFS();}if(INTRO.i<0)return;if(INTRO.i<2)introGo(INTRO.i+1);else introEnd();}
$('intro').querySelector('.iskip').textContent=TOUCH?'Toca para saltar':'Haz clic o pulsa una tecla para saltar';$('intro').querySelector('.ipress').textContent=TOUCH?'Toca la pantalla para empezar':'Pulsa una tecla para empezar';
$('intro').addEventListener('click',e=>{e.stopPropagation();introTap();});
addEventListener('keydown',e=>{if(!INTRO.on)return;e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)introTap();},true);
(function introTick(){if(!INTRO.on)return;const rot=$('rot'),blocked=rot&&getComputedStyle(rot).display!=='none';
 if(!blocked){if(INTRO.i<0)introGo(0);else if(INTRO.i<2){INTRO.t+=.1;if(INTRO.t>=3.2)introGo(INTRO.i+1);}}
 setTimeout(introTick,100);})();
