.dim{position:absolute;inset:0;background:rgba(8,6,4,.72)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:var(--pap);border:3px solid #6b4426;border-radius:14px;box-shadow:0 20px 60px #000a;padding:22px 26px}
.dlg h3{font:700 24px Georgia;margin:0 0 6px}.dlg p{margin:0 0 14px;line-height:1.45}
.btn{display:block;width:100%;box-sizing:border-box;border-radius:10px;padding:11px 14px;margin:8px 0;font-weight:700;font-size:15px;border:2px solid #8a6a45;background:var(--card);color:var(--ink);text-align:left;cursor:pointer}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.btn.main{background:linear-gradient(#f2cd62,#dba63a);border-color:#8a5a1a}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px;opacity:.85}
.chk i{width:16px;height:16px;border:2px solid #8a6a45;border-radius:4px;display:inline-block;background:var(--card)}
.up{position:absolute;left:355px;top:460px;width:215px;height:62px;box-sizing:border-box;border-radius:10px;border:2px solid #8a5a1a;background:linear-gradient(#f2cd62,#dba63a);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:800;font-size:15px;cursor:pointer}
.up svg{flex:none}.up small{display:block;font-weight:500;font-size:11px;opacity:.8}
.up.ok{background:#e5f2dc;border-color:#5b8a3a}
.rib{position:absolute;left:1106px;top:407px;width:58px;height:56px;background:#5a3418;border-radius:0 8px 8px 0;color:#f6ecd6;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.page{position:absolute;left:107px;top:83px;width:1000px;height:592px;background:var(--pap);border-radius:6px;display:flex}
.pl,.pr{flex:1;padding:22px 26px;box-sizing:border-box}.pl{border-right:1px solid var(--line)}
.page h2{font:700 30px Georgia;margin:0}.sub{font-style:italic;font-size:13px;opacity:.7;margin:4px 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs span{padding:5px 10px;border-radius:999px;border:1px solid #c9b48c;background:var(--card);font-weight:700;font-size:13px}
.tabs span.on{background:#c0392b;color:#fff;border-color:#8a2318}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;opacity:.6}
tr.me td{background:#f3dc9a;font-weight:700}td.n{font-weight:800;width:26px}td.s{text-align:right;font-variant-numeric:tabular-nums}
.erab{display:flex;gap:6px;margin-bottom:10px}.erab span{padding:4px 10px;border-radius:6px;border:1px solid #c9b48c;font-size:12px}.erab span.on{background:#3a2617;color:#f6ecd6}
.toast{position:absolute;left:355px;top:460px;width:215px;height:62px;box-sizing:border-box;border-radius:10px;border:2px solid #5b8a3a;background:#e5f2dc;padding:8px 12px;font-size:13px}
.toast b{font-size:15px}
.ann{position:absolute;border:3px solid #ff2a2a;border-radius:8px;pointer-events:none}.ann span{position:absolute;left:-3px;top:-24px;background:#ff2a2a;color:#fff;font:700 12px system-ui;padding:3px 7px;border-radius:5px;white-space:nowrap}
body.noann .ann{display:none}
.holo{--pap:#0f1d24;--card:#132a33;--ink:#bff6ff;--line:#2b5866;--gold:#3fe8ff}
.holo .dlg{border-color:#3fe8ff;box-shadow:0 0 30px #3fe8ff55}.holo .btn{border-color:#2b8a99}.holo .btn.main{background:linear-gradient(#45e6ff,#1aa8c4);color:#04161b}
.holo .dlg h3{font-family:system-ui;letter-spacing:.5px}.holo .chk i{border-color:#2b8a99}
.inp{border:2px solid #8a6a45;border-radius:8px;background:var(--card);padding:10px 12px;font-size:17px;font-weight:700;margin:4px 0 6px}
.note{font-size:12px;opacity:.75}
</style></head><body>
<div class="bar"><b>Pantalla</b><button data-s="fin" class="on">1 · Final de partida</button><button data-s="aviso">2 · Aviso al seguir sin subir</button><button data-s="nombre">3 · Nombre del piloto</button><button data-s="hecho">4 · Subida</button><button data-s="tabla">5 · Clasificación</button>
<b>Era</b><button data-e="perg" class="on">Fantástica</button><button data-e="holo">Distópica</button>
<b>Resolución</b><button data-r="1280" class="on">1280×720</button><button data-r="1920">1920×1080</button><button data-r="2560">2560×1440</button><button data-r="m">Móvil</button>
<b></b><button id="an">Marcos rojos</button></div>
<div id="wrap"><div id="st"></div></div>
<script>
const UP='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17V5M7 10l5-5 5 5"/><path d="M4 21V14M20 21V12" opacity=".5"/></svg>';
const TROF='<svg width="24" height="22" viewBox="0 0 24 22" fill="#f2cd62" stroke="#1b1712" stroke-width="1.4"><rect x="8.5" y="6" width="7" height="15"/><rect x="1.5" y="11" width="7" height="10" fill="#d9d2c2"/><rect x="15.5" y="14" width="7" height="7" fill="#d08a4a"/><path d="M12 1l1 2 2 .3-1.5 1.4.4 2.1L12 5.8l-1.9 1 .4-2.1L9 3.3l2-.3z"/></svg>';
const rib='<div class="rib">'+TROF+'Clasificación</div><div class="ann" style="left:1102px;top:403px;width:66px;height:64px"><span>Cinta nueva: Clasificación</span></div>';
const S={
fin:()=>'<div class="up">'+UP+'<div>Subir a la clasificación<small>Amenaza 4 · 12.000 puntos</small></div></div><div class="ann" style="left:349px;top:454px;width:227px;height:74px"><span>Botón nuevo (en el hueco libre)</span></div>'+rib,
aviso:()=>S.fin()+'<div class="dim"></div><div class="dlg"><h3>Aún no has subido esta partida</h3><p>Ahora puedes subir tus partidas a la <b>clasificación</b> y compararte con el resto de jugadores de tu mismo nivel de amenaza. ¿Quieres subirla?</p><button class="btn main">Sí, y súbelas siempre<small>Se suben solas al acabar, solo cuando sea tu mejor marca con ese héroe</small></button><button class="btn">Sí, solo esta</button><button class="btn">No, gracias</button><div class="chk"><i></i>No volver a mostrar este aviso</div><p class="note" style="margin-top:10px">Se puede cambiar en Opciones › Juego › Clasificación: Siempre / Preguntar / Nunca.</p><div class="ann" style="inset:-8px"><span>Sale al pulsar «Jugar de nuevo» o «Menú principal» sin haber subido</span></div></div>',
nombre:()=>S.fin()+'<div class="dim"></div><div class="dlg"><h3>¿Cómo se llama tu piloto?</h3><p>Es el nombre con el que saldrás en la clasificación.</p><div class="inp">Nogal▌</div><p class="note">Solo se pregunta la primera vez. Se puede cambiar en Opciones. En Steam se usará tu nombre de Steam.</p><button class="btn main" style="text-align:center">Subir partida</button><div class="ann" style="inset:-8px"><span>Solo la primera vez</span></div></div>',
hecho:()=>'<div class="toast"><b>¡Subida! Puesto 3</b><br>de 12 en Amenaza 4 · Era Fantástica</div><div class="ann" style="left:349px;top:454px;width:227px;height:74px"><span>El botón pasa a mostrar tu puesto</span></div>'+rib,
tabla:()=>'<div class="page"><div class="pl"><h2>Clasificación</h2><div class="sub">Una tabla por nivel de amenaza · tu mejor partida con cada héroe</div><div class="erab"><span class="on">Era Fantástica</span><span>Ruinas de Neón</span></div><div class="tabs">'+[0,1,2,3,4,5,6,7].map(n=>'<span'+(n===4?' class="on"':'')+'>'+n+'</span>').join('')+'</div><p class="note">Amenaza = puntos de amenaza menos apoyos. Toca un nivel para ver su tabla. Los niveles sin partidas no salen.</p><p class="note" style="margin-top:18px"><b>Tu mejor marca aquí:</b> 3.º con Reinhart · 12.000</p></div><div class="pr"><table><tr><th>#</th><th>Piloto</th><th>Héroe</th><th>Ronda</th><th style="text-align:right">Puntos</th></tr>'+[['Bodom','Vega','15 ✓','18.450'],['Lyra','Radagast','15 ✓','14.200'],['Nogal','Reinhart','15','12.000',1],['Kiro','Ferro','14','11.320'],['Mar','Reinhart','13','9.870'],['Txus','Radagast','12','8.410'],['Ana','Vega','11','7.300']].map((r,i)=>'<tr'+(r[4]?' class="me"':'')+'><td class="n">'+(i+1)+'</td><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="s">'+r[3]+'</td></tr>').join('')+'</table><p class="note">v323 · se puede filtrar por versión si un cambio de equilibrio descoloca las puntuaciones.</p></div></div><div class="ann" style="left:123px;top:206px;width:300px;height:36px"><span style="top:auto;bottom:-24px">Pestañas por nivel de amenaza</span></div><div class="ann" style="left:600px;top:96px;width:500px;height:300px"><span>Tu fila resaltada</span></div>'};
let st={s:'fin',e:'perg',r:'1280'};
function R(){const el=document.getElementById('st');el.innerHTML=S[st.s]();el.className=st.e==='holo'?'holo':'';const W={1280:1280,1920:1920,2560:2560,m:844}[st.r];const k=W/1280;el.style.transform='scale('+k+')';document.getElementById('wrap').style.height=(720*k+20)+'px';}
document.querySelectorAll('.bar button[data-s],.bar button[data-e],.bar button[data-r]').forEach(b=>b.onclick=()=>{const k=b.dataset.s?'s':b.dataset.e?'e':'r';st[k]=b.dataset[k];document.querySelectorAll('.bar button[data-'+k+']').forEach(x=>x.classList.toggle('on',x===b));R();});
document.getElementById('an').onclick=()=>document.body.classList.toggle('noann');
const q=new URLSearchParams(location.search);if(q.get('s'))st.s=q.get('s');if(q.get('e'))st.e=q.get('e');R();
</script></body></html>
