<!doctype html><html><head><meta charset="utf-8"><title>Cofre y Grietas</title><style>
body{margin:0;background:#0d0b09;color:#eee;font:14px system-ui}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#1b1712;position:sticky;top:0;z-index:20}
.bar b{align-self:center;margin:0 4px 0 10px;font-size:12px;opacity:.7}
.bar button{background:#2c251c;color:#eee;border:1px solid #4a3e30;border-radius:6px;padding:6px 10px;cursor:pointer}.bar button.on{background:#e9b949;color:#1b1712;font-weight:700}
.desc{padding:8px 16px;opacity:.85;max-width:1100px}
#st{position:relative;width:1280px;height:720px;margin:0 14px 14px;overflow:hidden;background:#000 center/100% 100%;transform-origin:0 0}
#st .dim{position:absolute;inset:0;background:rgba(5,4,3,.55);opacity:0;transition:opacity .25s}
#st.go .dim{opacity:1}
.full{position:absolute;inset:0;background:center/100% 100%;opacity:0;transition:opacity .35s}
.card{position:absolute;opacity:0;will-change:transform}
.prop{position:absolute;left:640px;top:360px;width:0;height:0}
.prop svg{position:absolute;left:-90px;top:-90px;overflow:visible}
@keyframes drop{0%{transform:translateY(-420px) scale(.9)}70%{transform:translateY(0) scale(1.06,.94)}85%{transform:translateY(-14px)}100%{transform:none}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes lid{to{transform:rotate(-58deg)}}
@keyframes rays{from{transform:rotate(0) scale(.2);opacity:0}30%{opacity:1}to{transform:rotate(80deg) scale(1.4);opacity:0}}
@keyframes chute{0%{transform:translateY(-560px)}75%{transform:translateY(0)}86%{transform:translateY(-10px)}100%{transform:none}}
@keyframes chuteoff{to{transform:translate(120px,-60px) rotate(25deg);opacity:0}}
@keyframes dust{from{transform:scale(.3);opacity:.8}to{transform:scale(1.6);opacity:0}}
@keyframes panel{to{transform:rotate(80deg);opacity:.0}}
@keyframes panelr{to{transform:rotate(-80deg);opacity:.0}}
@keyframes beam{0%{opacity:0;transform:scaleY(.1)}40%{opacity:1}100%{opacity:0;transform:scaleY(1.2)}}
.skip{position:absolute;right:16px;bottom:12px;font-size:12px;opacity:.6;color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:18px;padding:0 16px 16px}
.gp{background:#2b3a2b;border-radius:12px;padding:12px;text-align:center;width:220px}
.gp.e2{background:#101722}.gp svg{display:block;margin:6px auto}.gp small{display:block;opacity:.8;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.sp{transform-origin:60px 60px;animation:spin 6s linear infinite}.spr{transform-origin:60px 60px;animation:spin 9s linear infinite reverse}.pl{animation:pulse 1.6s ease-in-out infinite}
</style></head><body>
<div class="bar"><b>Maqueta</b><button data-t="cofre" class="on">Animación del cofre</button><button data-t="grieta">Portal de las Grietas</button>
